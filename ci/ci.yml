# GitHub Actions workflow. Kept in ci/ on purpose.
# To turn it on, copy it to .github/workflows/ci.yml.
name: ci
on: [push, pull_request]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: make setup
      - name: Get a ClickHouse binary for the row policy test
        run: |
          mkdir -p /tmp/ch && cd /tmp/ch && curl -sSL https://clickhouse.com/ | sh
          echo "CLICKHOUSE_BIN=/tmp/ch/clickhouse" >> "$GITHUB_ENV"
      - run: make all
      - uses: actions/upload-artifact@v4
        with: {name: reports, path: reports/}
